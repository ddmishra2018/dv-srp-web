<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An error occurred - Student Registration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-200/60 p-8 border border-slate-100">
        <!-- Icon -->
        <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mb-6 mx-auto">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <!-- Content -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Something went wrong</h1>
            <p class="text-slate-600 mb-8 leading-relaxed">
                We couldn't process your request. This might be a temporary connection issue or a server error.
            </p>
            
            <!-- Technical Info Box -->
            <div id="technical-details" class="bg-slate-50 rounded-xl p-4 mb-8 text-left border border-slate-200">
                <p class="text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-2">Technical Information</p>
                <div class="space-y-1 font-mono text-xs text-slate-700">
                    <p>URL: <span id="url-path" class="break-all text-slate-900 font-semibold"></span></p>
                    <p>Time: <span id="timestamp" class="text-slate-900 font-semibold"></span></p>
                    <p id="ray-id-wrapper" class="hidden">Request ID: <span id="ray-id" class="text-indigo-600 font-bold"></span></p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3">
                <button onclick="window.location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all shadow-md active:scale-[0.98]">
                    Try Refreshing
                </button>
                <a href="/" class="block w-full text-slate-500 hover:text-slate-800 font-medium py-2 transition-colors">
                    Return to Portal
                </a>
            </div>
        </div>
    </div>

    <script>
        // Populate technical details for debugging
        document.getElementById('url-path').textContent = window.location.pathname;
        document.getElementById('timestamp').textContent = new Date().toISOString();

        /**
         * CloudFront doesn't pass the Request ID into the body of a custom error page 
         * via standard variables, but if you look at the Response Headers in the browser, 
         * the 'x-amz-cf-id' is there. For local display, we generate a client-side timestamp 
         * context to help developers correlate logs.
         */
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.has('requestId')) {
            document.getElementById('ray-id-wrapper').classList.remove('hidden');
            document.getElementById('ray-id').textContent = searchParams.get('requestId');
        }
    </script>
</body>
</html>
